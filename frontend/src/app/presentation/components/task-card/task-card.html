<div
  class="group rounded-2xl border border-white/10 bg-black/35 px-4 py-4 backdrop-blur-xl transition hover:border-violet-400/30 hover:bg-black/45 sm:px-5"
>
  <div class="flex items-center justify-between gap-4">
    <div class="flex min-w-0 flex-1 items-center gap-3">
      <button
        type="button"
        class="grid h-6 w-6 shrink-0 place-items-center rounded-full border transition"
        [class.border-lime]="task().completed"
        [class.bg-lime]="task().completed"
        [class.text-night]="task().completed"
        [class.border-white/20]="!task().completed"
        [class.group-hover:border-violet-400]="!task().completed"
        [disabled]="busy()"
        [attr.aria-label]="task().completed ? 'Marcar como pendiente' : 'Marcar como hecha'"
        (click)="toggleCompletion.emit(task().id)"
      >
        @if (task().completed) {
          <svg class="h-3.5 w-3.5" fill="none" viewBox="0 0 24 24" stroke="currentColor" stroke-width="3">
            <path stroke-linecap="round" stroke-linejoin="round" d="M5 13l4 4L19 7" />
          </svg>
        }
      </button>

      @if (editing()) {
        <form class="flex min-w-0 flex-1 flex-col gap-2 sm:flex-row" (ngSubmit)="saveEdit()">
          <input
            class="w-full rounded-full border border-white/10 bg-black/50 px-4 py-2 text-sm text-white outline-none focus:border-violet-400"
            [ngModel]="editTitle()"
            (ngModelChange)="editTitle.set($event)"
            name="editTitle"
          />
          <div class="flex gap-2">
            <button
              class="rounded-full bg-gradient-to-r from-violet-500 to-indigo-500 px-4 py-2 text-sm font-semibold text-white"
              type="submit"
            >
              Guardar
            </button>
            <button class="rounded-full px-3 py-2 text-sm text-slate-400" type="button" (click)="cancelEdit()">
              Cancelar
            </button>
          </div>
        </form>
      } @else {
        <button
          type="button"
          class="min-w-0 text-left font-medium text-white"
          [class.line-through]="task().completed"
          [class.text-slate-500]="task().completed"
          [disabled]="busy()"
          (click)="toggleCompletion.emit(task().id)"
        >
          {{ task().title }}
        </button>
      }
    </div>

    @if (!editing()) {
      <div class="flex shrink-0 items-center gap-2">
        <button
          type="button"
          title="Editar tarea"
          aria-label="Editar tarea"
          class="grid h-9 w-9 place-items-center rounded-full border border-white/10 bg-white/5 text-violet-300 transition hover:border-violet-400/50 hover:bg-violet-500/15 hover:text-white"
          [disabled]="busy()"
          (click)="startEdit()"
        >
          <svg class="h-4 w-4" fill="none" viewBox="0 0 24 24" stroke="currentColor" stroke-width="2">
            <path
              stroke-linecap="round"
              stroke-linejoin="round"
              d="M16.862 3.487a2.25 2.25 0 013.182 3.182L8.25 18.463 3 19.5l1.037-5.25L16.862 3.487z"
            />
          </svg>
        </button>
        <button
          type="button"
          title="Eliminar tarea"
          aria-label="Eliminar tarea"
          class="grid h-9 w-9 place-items-center rounded-full border border-white/10 bg-white/5 text-rose-300 transition hover:border-rose-400/50 hover:bg-rose-500/15 hover:text-white"
          [disabled]="busy()"
          (click)="deleteTask.emit(task().id)"
        >
          <svg class="h-4 w-4" fill="none" viewBox="0 0 24 24" stroke="currentColor" stroke-width="2">
            <path
              stroke-linecap="round"
              stroke-linejoin="round"
              d="M19 7l-.867 12.142A2 2 0 0116.138 21H7.862a2 2 0 01-1.995-1.858L5 7m5 4v6m4-6v6m1-10V4a1 1 0 00-1-1h-4a1 1 0 00-1 1v3M4 7h16"
            />
          </svg>
        </button>
      </div>
    }
  </div>
</div>
